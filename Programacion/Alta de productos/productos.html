<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alta de productos</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --ink:#1d2330; --muted:#6b7280; --line:#dde1e7; --accent:#2563eb; --danger:#dc2626; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--ink); }
  header { background:#111827; color:#fff; padding:14px 20px; display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between; }
  header h1 { font-size:18px; margin:0; }
  header .acciones { display:flex; gap:8px; flex-wrap:wrap; }
  main { padding:20px; display:grid; gap:20px; grid-template-columns: minmax(280px, 380px) 1fr; max-width:1300px; margin:0 auto; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; }
  .card h2 { font-size:15px; margin:0 0 12px; }
  label { display:block; font-size:12px; color:var(--muted); margin:8px 0 3px; }
  input, select { width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:6px; font-size:14px; background:#fff; }
  .fila { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .req::after { content:" *"; color:var(--danger); }
  button { padding:8px 14px; border:0; border-radius:6px; background:var(--accent); color:#fff; font-size:14px; cursor:pointer; }
  button.sec { background:#e5e7eb; color:var(--ink); }
  button.peligro { background:var(--danger); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .msg { margin-top:10px; font-size:13px; min-height:18px; }
  .msg.ok { color:#15803d; } .msg.error { color:var(--danger); }
  .toolbar { display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
  .toolbar input { flex:1; min-width:180px; }
  .tabla-wrap { overflow:auto; max-height:70vh; border:1px solid var(--line); border-radius:8px; }
  table { border-collapse:collapse; width:100%; font-size:13px; background:#fff; }
  th, td { padding:7px 9px; border-bottom:1px solid var(--line); text-align:left; white-space:nowrap; }
  th { position:sticky; top:0; background:#f9fafb; font-weight:600; }
  td.num, th.num { text-align:right; }
  .vacio { text-align:center; color:var(--muted); padding:30px; }
  .contador { font-size:13px; color:var(--muted); margin-left:auto; }
</style>
</head>
<body>

<header>
  <h1>Alta de productos</h1>
  <div class="acciones">
    <button class="sec" id="btnAbrir">Abrir base…</button>
    <input type="file" id="archivoBase" accept=".sqlite,.db" hidden>
    <button id="btnGuardar">Guardar base (.sqlite)</button>
    <button class="sec" id="btnCsv">Exportar CSV</button>
  </div>
</header>

<main>
  <section class="card">
    <h2>Nuevo producto</h2>
    <form id="form" autocomplete="off">
      <label class="req" for="codigo_interno">Código interno</label>
      <input id="codigo_interno" required>

      <label for="codigo_barras">Código de barras</label>
      <input id="codigo_barras" inputmode="numeric">

      <label class="req" for="nombre">Nombre / descripción</label>
      <input id="nombre" required maxlength="120">

      <label for="grupo">Línea / grupo / familia</label>
      <input id="grupo" placeholder="Ej: Abarrotes, Tecnología">

      <div class="fila">
        <div>
          <label for="costo">Costo compra (sin IVA)</label>
          <input id="costo" type="number" min="0" step="any">
        </div>
        <div>
          <label class="req" for="impuesto">Impuesto</label>
          <select id="impuesto" required>
            <option value="IVA 19%">IVA 19%</option>
            <option value="IVA 5%">IVA 5%</option>
            <option value="Exento">Exento</option>
            <option value="Excluido">Excluido</option>
          </select>
        </div>
      </div>

      <div class="fila">
        <div>
          <label for="precio_detal">Precio detal</label>
          <input id="precio_detal" type="number" min="0" step="any">
        </div>
        <div>
          <label for="precio_mayorista">Precio mayorista</label>
          <input id="precio_mayorista" type="number" min="0" step="any">
        </div>
      </div>

      <label for="inc">Impuesto al consumo INC (%)</label>
      <input id="inc" type="number" min="0" step="any" value="0">

      <div style="margin-top:14px; display:flex; gap:8px;">
        <button type="submit">Guardar producto</button>
        <button type="button" class="sec" id="btnLimpiar">Limpiar</button>
      </div>
      <div class="msg" id="msgForm"></div>
    </form>
  </section>

  <section class="card">
    <h2>Productos <span class="contador" id="contador"></span></h2>
    <div class="toolbar">
      <input id="buscar" placeholder="Buscar por código, código de barras o nombre…">
    </div>
    <div class="tabla-wrap">
      <table>
        <thead>
          <tr>
            <th>Código</th><th>Barras</th><th>Nombre</th><th>Grupo</th>
            <th class="num">Costo</th><th class="num">Detal</th><th class="num">Mayor.</th>
            <th>Impuesto</th><th class="num">INC %</th><th></th>
          </tr>
        </thead>
        <tbody id="cuerpo"></tbody>
      </table>
    </div>
    <div class="msg" id="msgLista"></div>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
<script>
(async function () {
  const SQL = await initSqlJs({
    locateFile: f => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/${f}`
  });

  let db = null;
  let cambios = false;

  const $ = id => document.getElementById(id);

  const ESQUEMA = `
    CREATE TABLE IF NOT EXISTS productos (
      id INTEGER PRIMARY KEY AUTOINCREMENT,
      codigo_interno TEXT NOT NULL UNIQUE,
      codigo_barras TEXT,
      nombre TEXT NOT NULL,
      grupo TEXT,
      costo REAL,
      precio_detal REAL,
      precio_mayorista REAL,
      impuesto TEXT NOT NULL,
      inc REAL DEFAULT 0,
      creado TEXT NOT NULL
    );
    CREATE INDEX IF NOT EXISTS idx_barras ON productos(codigo_barras);
  `;

  function nuevaBase() {
    db = new SQL.Database();
    db.run(ESQUEMA);
    cambios = false;
    listar();
  }

  function mensaje(el, texto, tipo) {
    el.textContent = texto;
    el.className = "msg " + (tipo || "");
  }

  function numOrNull(v) {
    if (v === "" || v === null || v === undefined) return null;
    const n = Number(v);
    return Number.isFinite(n) ? n : null;
  }

  function txtOrNull(v) {
    const t = (v || "").trim();
    return t === "" ? null : t;
  }

  // ---- Guardar producto ----
  $("form").addEventListener("submit", e => {
    e.preventDefault();
    const datos = {
      codigo_interno: txtOrNull($("codigo_interno").value),
      codigo_barras: txtOrNull($("codigo_barras").value),
      nombre: txtOrNull($("nombre").value),
      grupo: txtOrNull($("grupo").value),
      costo: numOrNull($("costo").value),
      precio_detal: numOrNull($("precio_detal").value),
      precio_mayorista: numOrNull($("precio_mayorista").value),
      impuesto: $("impuesto").value,
      inc: numOrNull($("inc").value) ?? 0
    };

    if (!datos.codigo_interno || !datos.nombre) {
      mensaje($("msgForm"), "Código interno y nombre son obligatorios.", "error");
      return;
    }

    // Validaciones de negocio
    if (datos.codigo_barras && !/^\d{6,14}$/.test(datos.codigo_barras)) {
      mensaje($("msgForm"), "El código de barras debe tener entre 6 y 14 dígitos.", "error");
      return;
    }
    if (datos.costo !== null && datos.precio_detal !== null && datos.precio_detal < datos.costo) {
      mensaje($("msgForm"), "Advertencia: el precio detal es menor que el costo.", "error");
      // no bloquea, solo avisa
    }

    try {
      db.run(
        `INSERT INTO productos (codigo_interno, codigo_barras, nombre, grupo, costo,
                                precio_detal, precio_mayorista, impuesto, inc, creado)
         VALUES (?,?,?,?,?,?,?,?,?,?)`,
        [datos.codigo_interno, datos.codigo_barras, datos.nombre, datos.grupo, datos.costo,
         datos.precio_detal, datos.precio_mayorista, datos.impuesto, datos.inc,
         new Date().toISOString()]
      );
      cambios = true;
      mensaje($("msgForm"), "Producto guardado.", "ok");
      limpiarForm(false);
      listar();
    } catch (err) {
      const txt = String(err.message || err);
      if (txt.includes("UNIQUE") && txt.includes("codigo_interno")) {
        mensaje($("msgForm"), "Ya existe un producto con ese código interno.", "error");
      } else {
        mensaje($("msgForm"), "Error al guardar: " + txt, "error");
      }
    }
  });

  function limpiarForm(borrarMsg = true) {
    $("form").reset();
    $("inc").value = "0";
    if (borrarMsg) mensaje($("msgForm"), "", "");
    $("codigo_interno").focus();
  }
  $("btnLimpiar").addEventListener("click", () => limpiarForm(true));

  // ---- Listado / búsqueda ----
  function listar() {
    const q = "%" + $("buscar").value.trim() + "%";
    const stmt = db.prepare(`
      SELECT id, codigo_interno, codigo_barras, nombre, grupo, costo,
             precio_detal, precio_mayorista, impuesto, inc
      FROM productos
      WHERE codigo_interno LIKE ? OR IFNULL(codigo_barras,'') LIKE ? OR nombre LIKE ?
      ORDER BY codigo_interno`);
    stmt.bind([q, q, q]);

    const filas = [];
    while (stmt.step()) filas.push(stmt.getAsObject());
    stmt.free();

    const total = db.exec("SELECT COUNT(*) FROM productos")[0].values[0][0];
    $("contador").textContent = `${filas.length} de ${total}`;

    const cuerpo = $("cuerpo");
    cuerpo.innerHTML = "";
    if (filas.length === 0) {
      const tr = document.createElement("tr");
      const td = document.createElement("td");
      td.colSpan = 10; td.className = "vacio";
      td.textContent = total === 0 ? "Aún no hay productos." : "Sin resultados.";
      tr.appendChild(td); cuerpo.appendChild(tr);
      return;
    }

    const fmt = v => (v === null || v === undefined) ? "" : v;
    for (const p of filas) {
      const tr = document.createElement("tr");
      const celdas = [
        p.codigo_interno, p.codigo_barras, p.nombre, p.grupo,
        fmt(p.costo), fmt(p.precio_detal), fmt(p.precio_mayorista), p.impuesto, fmt(p.inc)
      ];
      celdas.forEach((val, i) => {
        const td = document.createElement("td");
        td.textContent = val === null ? "" : val;
        if (i >= 4 && i <= 6 || i === 8) td.className = "num";
        tr.appendChild(td);
      });
      const tdAcc = document.createElement("td");
      const btn = document.createElement("button");
      btn.textContent = "Eliminar";
      btn.className = "peligro";
      btn.style.padding = "4px 8px";
      btn.addEventListener("click", () => eliminar(p.id, p.codigo_interno));
      tdAcc.appendChild(btn);
      tr.appendChild(tdAcc);
      cuerpo.appendChild(tr);
    }
  }
  $("buscar").addEventListener("input", listar);

  function eliminar(id, codigo) {
    if (!confirm(`¿Eliminar el producto ${codigo}?`)) return;
    db.run("DELETE FROM productos WHERE id = ?", [id]);
    cambios = true;
    mensaje($("msgLista"), `Producto ${codigo} eliminado.`, "ok");
    listar();
  }

  // ---- Guardar / abrir base ----
  $("btnGuardar").addEventListener("click", () => {
    const bytes = db.export();
    const blob = new Blob([bytes], { type: "application/octet-stream" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const fecha = new Date().toISOString().slice(0, 10);
    a.href = url;
    a.download = `productos_${fecha}.sqlite`;
    a.click();
    URL.revokeObjectURL(url);
    cambios = false;
    mensaje($("msgLista"), "Base descargada. Guárdala en tu carpeta de OneDrive o donde la respaldes.", "ok");
  });

  $("btnAbrir").addEventListener("click", () => $("archivoBase").click());
  $("archivoBase").addEventListener("change", async e => {
    const f = e.target.files[0];
    if (!f) return;
    if (cambios && !confirm("Hay cambios sin descargar. ¿Abrir otra base de todos modos?")) {
      e.target.value = ""; return;
    }
    const buf = new Uint8Array(await f.arrayBuffer());
    try {
      db = new SQL.Database(buf);
      db.run(ESQUEMA); // asegura la tabla si el archivo es nuevo
      cambios = false;
      mensaje($("msgLista"), `Base cargada: ${f.name}`, "ok");
      listar();
    } catch (err) {
      mensaje($("msgLista"), "No se pudo abrir el archivo: " + err.message, "error");
    }
    e.target.value = "";
  });

  // ---- Exportar CSV ----
  $("btnCsv").addEventListener("click", () => {
    const res = db.exec(`SELECT codigo_interno, codigo_barras, nombre, grupo, costo,
                                precio_detal, precio_mayorista, impuesto, inc, creado
                         FROM productos ORDER BY codigo_interno`);
    if (!res.length) { mensaje($("msgLista"), "No hay productos para exportar.", "error"); return; }
    const cab = res[0].columns;
    const esc = v => {
      if (v === null || v === undefined) return "";
      const s = String(v);
      return /[",\n;]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
    };
    const lineas = [cab.join(";"), ...res[0].values.map(r => r.map(esc).join(";"))];
    const blob = new Blob(["\uFEFF" + lineas.join("\n")], { type: "text/csv;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `productos_${new Date().toISOString().slice(0, 10)}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  });

  window.addEventListener("beforeunload", e => {
    if (cambios) { e.preventDefault(); e.returnValue = ""; }
  });

  nuevaBase();
  $("codigo_interno").focus();
})();
</script>
</body>
</html>
